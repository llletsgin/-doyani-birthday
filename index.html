<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>최도야니 생일열차 🚇</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    min-height: 100vh;
    padding: 30px 20px;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #f4f4f4;
    font-family: -apple-system, BlinkMacSystemFont,
    "Apple SD Gothic Neo", sans-serif;
}

.container {
    width: 100%;
    max-width: 430px;
    background: white;
    border-radius: 25px;
    padding: 30px 22px;
    text-align: center;
    box-shadow: 0 10px 35px rgba(0,0,0,.08);
}

.metro {
    color: #00a84d;
    font-size: 14px;
    font-weight: 800;
}

h1 {
    font-size: 24px;
    margin: 8px 0 10px;
}

.description {
    color: #888;
    font-size: 14px;
    margin-bottom: 25px;
}

.line {
    width: 58px;
    height: 58px;
    margin: auto;
    border-radius: 50%;
    background: #00a84d;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 27px;
    font-weight: 900;
}

#station {
    margin: 20px 0 5px;
    font-size: 38px;
    font-weight: 900;
}

#count {
    color: #999;
    font-size: 14px;
    margin-bottom: 20px;
}

input {
    width: 100%;
    height: 55px;
    border: 2px solid #ddd;
    border-radius: 14px;
    text-align: center;
    font-size: 19px;
    outline: none;
}

input:focus {
    border-color: #00a84d;
}

button {
    width: 100%;
    height: 53px;
    margin-top: 12px;
    border: 0;
    border-radius: 14px;
    background: #00a84d;
    color: white;
    font-size: 17px;
    font-weight: 800;
}

#result {
    min-height: 25px;
    margin-top: 15px;
    font-weight: 700;
}

#birthday {
    display: none;
}

.cake {
    font-size: 70px;
}

.arrive {
    margin-top: 15px;
    color: #888;
}

.birthday-title {
    margin: 5px 0 20px;
    font-size: 30px;
    font-weight: 900;
}

.letter {
    padding: 25px 15px;
    background: #fff8dc;
    border-radius: 20px;
    font-size: 17px;
    line-height: 2;
}

.emoji {
    margin-top: 25px;
    font-size: 27px;
}
</style>
</head>

<body>

<div class="container">

<div id="game">

    <div class="metro">SEOUL METRO · LINE 2</div>

    <h1>🚇 최도야니의 지하철 게임</h1>

    <div class="description">
        2호선 역 이름을 정확하게 입력하세요
    </div>

    <div class="line">2</div>

    <div id="station"></div>

    <div id="count"></div>

    <input
        id="answer"
        placeholder="역 이름 입력"
        autocomplete="off"
    >

    <button id="nextButton">
        다음 역 🚇
    </button>

    <div id="result"></div>

</div>


<div id="birthday">

    <div class="cake">🎂</div>

    <div class="arrive">
        이번 역은…
    </div>

    <div class="birthday-title">
        최도야니 생일역 🎉
    </div>
<img
    src="doyani.jpg"
    alt="도야니"
    style="
        width: 100%;
        max-width: 300px;
        border-radius: 18px;
        margin: 5px auto 20px;
        display: block;
    "
>
    <div class="letter">

        게임을 즐겨하지 않는 도야니지민<br>
        이건 재밌지~~???<br><br>

        <b>생일축하해 &gt;_&lt;</b>

        <br><br>

        -윤선이가-

    </div>

    <div class="emoji">
        🎉 🎈 🎁 🎂 🎁 🎈 🎉
    </div>

</div>

</div>


<script>

const stations = [
    "강남",
    "역삼",
    "선릉",
    "삼성",
    "종합운동장"
];

let current = 0;

const station = document.getElementById("station");
const count = document.getElementById("count");
const answer = document.getElementById("answer");
const result = document.getElementById("result");
const button = document.getElementById("nextButton");


function updateStation() {

    station.innerText = stations[current];

    count.innerText =
        (current + 1) + " / 5 번째 역";

    answer.value = "";

}


function checkAnswer() {

    const typed = answer.value.trim();

    if (typed === stations[current]) {

        result.style.color = "#00a84d";
        result.innerText = "정답! 다음 역으로 출발 🚇";

        current++;

        if (current === 5) {

            setTimeout(showBirthday, 600);

        } else {

            setTimeout(() => {

                result.innerText = "";
                updateStation();

            }, 500);

        }

    } else {

        result.style.color = "#e34b4b";
        result.innerText = "땡! 다시 입력해봐 😈";

        answer.select();

    }

}


function showBirthday() {

    document.getElementById("game").style.display = "none";
    document.getElementById("birthday").style.display = "block";

}


button.addEventListener("click", checkAnswer);

answer.addEventListener("keydown", function(e) {

    if (e.key === "Enter") {
        checkAnswer();
    }

});


updateStation();

</script>

</body>
</html>
